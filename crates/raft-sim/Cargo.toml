[package]
name = "raft-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Deterministic discrete-event fault simulator, nemesis, and linearizability checker for raftkv"

[[bin]]
name = "raft-sim"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
bytes = "1.12.2"
clap = { version = "4.6.8", features = ["derive"] }
raft-core = { version = "0.1.0", path = "../raft-core" }
raftkv-kv = { version = "0.1.0", path = "../raftkv-kv" }
raftkv-wal = { version = "0.1.0", path = "../raftkv-wal", features = ["fault-injection"] }
rand = "0.10.4"
rand_chacha = "0.10.0"
