[package]
name = "raftkv-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Leader-following gRPC client library and CLI tool (raftkvctl) for raftkv clusters"

[[bin]]
name = "raftkvctl"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
bytes = "1.12.2"
clap = { version = "4.6.8", features = ["derive"] }
raftkv-proto = { version = "0.1.0", path = "../raftkv-proto" }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "io-std"] }
tonic = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["net", "sync"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
