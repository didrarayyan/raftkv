[package]
name = "raftkv-wal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "CRC-32 checksummed segmented write-ahead log and atomic snapshot store with fault-injecting Fs"

[lints]
workspace = true

[dependencies]
bytes = "1.12.2"
crc32fast = "1.5.5"
raft-core = { version = "0.1.0", path = "../raft-core" }
rand = { version = "0.10.4", optional = true }
rand_chacha = { version = "0.10.0", optional = true }
thiserror = "2.0.21"

[features]
fault-injection = ["dep:rand", "dep:rand_chacha"]

[[bench]]
name = "wal_append"
harness = false

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"
rand = "0.10.4"
rand_chacha = "0.10.0"
tempfile = "3.27.0"
