[package]
name = "raftkv-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "raftkvd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.2"
clap = { version = "4.6.8", features = ["derive"] }
prost = "0.14.6"
raft-core = { version = "0.1.0", path = "../raft-core" }
raftkv-kv = { version = "0.1.0", path = "../raftkv-kv" }
raftkv-proto = { version = "0.1.0", path = "../raftkv-proto" }
raftkv-wal = { version = "0.1.0", path = "../raftkv-wal" }
rand = "0.10.4"
rand_chacha = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tokio-stream = "0.1.19"
toml = "1.2.1"
tonic = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
