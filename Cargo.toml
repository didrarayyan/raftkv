[workspace]
resolver = "3"
members = [
    "crates/raft-core",
    "crates/raftkv-kv",
    "crates/raftkv-wal",
    "crates/raftkv-proto",
    "crates/raftkv-server",
    "crates/raftkv-cli",
    "crates/raft-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.100.0"
repository = "https://github.com/didrarayyan/Mini-etcd"
keywords = ["raft", "consensus", "distributed-systems", "kv-store", "wal"]
categories = ["algorithms", "database-implementations", "network-programming"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Raft uses matching domain prefixes across crate boundaries (e.g. RaftNode, WalError).
module_name_repetitions = "allow"
# All public Error types are self-explanatory via typed variants and Display docs.
missing_errors_doc = "allow"
# Accessors and builder-free pure helpers do not need #[must_use] noise everywhere.
must_use_candidate = "allow"
# Explicit index/term and length conversions are checked against protocol bounds.
cast_possible_truncation = "allow"
# Domain pairs like prev_index/prev_term and client_id/request_id are intentionally parallel.
similar_names = "allow"
# State machine transition handlers stay clearer as cohesive match blocks.
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
