<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320">
  <rect x="0" y="0" width="960" height="320" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5" />

  <!-- Panel 1: WAL Segment Format -->
  <text x="32" y="34" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">WAL SEGMENT FORMAT (wal/&lt;seq&gt;.wal · 64 MiB ROTATION)</text>

  <rect x="32" y="52" width="124" height="54" rx="6" fill="#111923" stroke="#38BDF8" stroke-width="1.5" />
  <text x="94" y="75" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">"RKVWAL01"</text>
  <text x="94" y="95" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Magic · 8 B</text>

  <rect x="162" y="52" width="110" height="54" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="217" y="75" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">seq</text>
  <text x="217" y="95" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">u64 LE · 8 B</text>

  <rect x="278" y="52" width="114" height="54" rx="6" fill="#211410" stroke="#F97316" stroke-width="1.5" />
