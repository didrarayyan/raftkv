  <text x="215" y="227" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">index</text>
  <text x="215" y="247" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">u64 LE · 8 B</text>

  <rect x="274" y="204" width="106" height="54" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="327" y="227" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">term</text>
  <text x="327" y="247" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">u64 LE · 8 B</text>

  <rect x="386" y="204" width="114" height="54" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="443" y="227" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">data_len</text>
  <text x="443" y="247" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">u64 LE · 8 B</text>

  <rect x="506" y="204" width="302" height="54" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="657" y="227" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">snapshot payload</text>
  <text x="657" y="247" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">protobuf KvStore entries + 4,096 client sessions</text>

  <rect x="814" y="204" width="114" height="54" rx="6" fill="#211410" stroke="#F97316" stroke-width="1.5" />
  <text x="871" y="227" text-anchor="middle" fill="#F97316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">crc32</text>
  <text x="871" y="247" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">u32 LE · 4 B</text>

  <rect x="32" y="272" width="896" height="30" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
  <text x="480" y="291" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">
    <tspan fill="#38BDF8" font-weight="700">Atomic Persistence:</tspan> write temp -&gt; sync_data() -&gt; atomic rename -&gt; sync_dir() · fail-stop abort on EIO or non-final corruption
  </text>
