  <text x="335" y="95" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">u32 LE · 4 B</text>

  <rect x="398" y="52" width="104" height="54" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="450" y="75" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">len</text>
  <text x="450" y="95" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">u32 LE · 4 B</text>

  <rect x="508" y="52" width="114" height="54" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="565" y="75" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">kind</text>
  <text x="565" y="95" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">u8 · 1=Entry, 2=HS</text>

  <rect x="628" y="52" width="300" height="54" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="778" y="75" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">payload (variable)</text>
  <text x="778" y="95" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Entry(term, idx, noop|cmd) or 24 B HardState</text>

  <!-- CRC Coverage Bracket -->
  <path d="M 398 114 L 398 124 L 928 124 L 928 114" fill="none" stroke="#F97316" stroke-width="1.5" />
  <text x="663" y="142" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">
    <tspan fill="#F97316" font-weight="700">IEEE CRC-32 coverage:</tspan> [len .. payload_end] · partial final-segment tail truncated cleanly on Wal::open recovery
  </text>

  <!-- Divider -->
  <line x1="32" y1="162" x2="928" y2="162" stroke="#21262D" stroke-width="1.5" />

  <!-- Panel 2: Snapshot Format -->
  <text x="32" y="188" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">ATOMIC SNAPSHOT FORMAT (snap/&lt;index&gt;.snap)</text>

