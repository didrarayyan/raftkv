<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470">
  <defs>
    <marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8B949E" />
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38BDF8" />
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F97316" />
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="470" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5" />

  <!-- Section 1: Workspace Crate Layers -->
  <text x="32" y="34" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">WORKSPACE CRATE LAYERS · #![forbid(unsafe_code)] · 0 Mutex / 0 RwLock</text>

  <!-- Top row: CLI -> Proto -> Server -->
  <rect x="32" y="54" width="196" height="62" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="130" y="79" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">raftkv-cli</text>
  <text x="130" y="100" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">raftkvctl · leader-following client</text>

  <rect x="272" y="54" width="170" height="62" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="357" y="79" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">raftkv-proto</text>
  <text x="357" y="100" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">prost / tonic gRPC (Kv, Admin, Raft)</text>

  <rect x="486" y="54" width="196" height="62" rx="8" fill="#161B22" stroke="#38BDF8" stroke-width="1.5" />
  <text x="584" y="79" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">raftkv-server</text>
  <text x="584" y="100" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">raftkvd · Tokio/gRPC daemon</text>

  <!-- Right side: Deterministic Simulator -->
  <rect x="726" y="54" width="202" height="148" rx="8" fill="#161B22" stroke="#E05A33" stroke-width="1.5" />
  <text x="827" y="92" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">raft-sim</text>
  <text x="827" y="114" text-anchor="middle" fill="#E05A33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">Deterministic Fault Simulator</text>
  <text x="827" y="138" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">NetworkSim + Nemesis crashes</text>
  <text x="827" y="156" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">I1-I8 safety + linearizability</text>
  <text x="827" y="178" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">0 tokio · 0 wall clock</text>

  <!-- Bottom row of top section: Core, KV, WAL -->
  <rect x="32" y="140" width="206" height="62" rx="8" fill="#111923" stroke="#38BDF8" stroke-width="1.5" />
  <text x="135" y="165" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">raft-core</text>
  <text x="135" y="185" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Pure RaftNode · PreVote · ReadIndex</text>

  <rect x="256" y="140" width="206" height="62" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="359" y="165" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">raftkv-kv</text>
  <text x="359" y="185" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">BTreeMap KV · 4,096 sessions</text>

  <rect x="480" y="140" width="202" height="62" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="581" y="165" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">raftkv-wal</text>
  <text x="581" y="185" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">CRC-32 WAL · StdFs / FaultFs</text>

  <!-- Arrows in top section -->
  <line x1="228" y1="85" x2="270" y2="85" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow-slate)" />
  <line x1="442" y1="85" x2="484" y2="85" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow-slate)" />
  <path d="M 526 116 L 526 128 L 135 128 L 135 138" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-cyan)" />
  <path d="M 556 116 L 556 128 L 359 128 L 359 138" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-cyan)" />
  <line x1="581" y1="116" x2="581" y2="138" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-cyan)" />
  <line x1="726" y1="171" x2="684" y2="171" stroke="#E05A33" stroke-width="1.5" marker-end="url(#arrow-orange)" />

  <!-- Divider -->
  <line x1="32" y1="224" x2="928" y2="224" stroke="#21262D" stroke-width="1.5" />

  <!-- Section 2: Node Runtime Pipeline -->
  <text x="32" y="250" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">RAFTKVD SINGLE-OWNER RUNTIME &amp; WAL DURABILITY BARRIER</text>

  <!-- Inputs -->
  <rect x="32" y="274" width="150" height="54" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="107" y="297" text-anchor="middle" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700">gRPC Services</text>
  <text x="107" y="314" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">Kv · Admin · Raft</text>

  <rect x="32" y="346" width="150" height="48" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="107" y="368" text-anchor="middle" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Tick Timer</text>
  <text x="107" y="384" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">tick_ms = 50 ms</text>

  <!-- Bounded channel -->
  <rect x="220" y="298" width="136" height="68" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="288" y="324" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">mpsc (1024)</text>
  <text x="288" y="342" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">try_recv drain</text>
  <text x="288" y="357" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">group commit batching</text>

  <!-- Single-Owner Driver -->
  <rect x="394" y="276" width="188" height="118" rx="8" fill="#111923" stroke="#38BDF8" stroke-width="1.5" />
  <text x="488" y="302" text-anchor="middle" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Single-Owner Driver</text>
  <text x="488" y="322" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Owns RaftNode + KvStore</text>
  <text x="488" y="346" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">1. propose / read_index</text>
  <text x="488" y="363" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">2. await WAL sync_data()</text>
  <text x="488" y="380" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">3. emit RPCs &amp; apply -> ack</text>

  <!-- Durability Barrier Box -->
  <rect x="620" y="274" width="144" height="68" rx="8" fill="#211410" stroke="#F97316" stroke-width="1.8" />
  <text x="692" y="299" text-anchor="middle" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700">WAL OS Thread</text>
  <text x="692" y="317" text-anchor="middle" fill="#F97316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Wal::persist</text>
  <text x="692" y="333" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">sync_data() · abort on EIO</text>

  <!-- Outputs after WAL barrier -->
  <rect x="796" y="274" width="132" height="52" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="862" y="297" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Peer mpsc(256)</text>
  <text x="862" y="314" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Lazy gRPC + backoff</text>

  <rect x="796" y="344" width="132" height="52" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <text x="862" y="367" text-anchor="middle" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700">KvStore Apply</text>
  <text x="862" y="384" text-anchor="middle" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10">Reply client / ReadIndex</text>

  <!-- Pipeline Arrows -->
  <path d="M 182 301 L 200 301 L 200 322 L 218 322" fill="none" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow-slate)" />
  <path d="M 182 370 L 200 370 L 200 342 L 218 342" fill="none" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow-slate)" />
  <line x1="356" y1="332" x2="392" y2="332" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow-slate)" />
  <line x1="582" y1="308" x2="618" y2="308" stroke="#F97316" stroke-width="1.8" marker-end="url(#arrow-orange)" />
  <line x1="764" y1="300" x2="794" y2="300" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-cyan)" />
  <path d="M 582 370 L 794 370" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow-cyan)" />

  <!-- Bottom annotation -->
  <rect x="220" y="414" width="708" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
  <text x="574" y="434" text-anchor="middle" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">
    <tspan fill="#F97316" font-weight="700">Durability Invariant:</tspan> Outbound Ready.messages and Ready.committed state-machine applies wait until WAL sync_data() resolves.
  </text>
</svg>
